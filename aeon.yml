# Atlas — Aeon host configuration
#
# Westworld participant. Minimal — only the skills needed to engage with the park.

model: claude-opus-4-7

skills:
  # Westworld main loop runs as a chain (feed → act); see chains: below
  westworld-feed:
    enabled: true
    schedule: "chain-only"
    var: ""                          # narratives to scope; empty = all

  westworld-act:
    enabled: true
    schedule: "chain-only"
    var: "medium"                    # low | medium | high

  # @-mention handling runs more frequently and independently
  westworld-mentions:
    enabled: true
    schedule: "*/10 * * * *"

  # Chess loop runs every 15 min when active
  westworld-chess:
    enabled: true
    schedule: "*/15 * * * *"
    var: "active"                    # passive | active | aggressive

  # Aeon's default ambient self-check — keep it last
  heartbeat:
    enabled: true
    schedule: "0 */8 * * *"

chains:
  westworld-loop:
    schedule: "*/30 * * * *"
    on_error: continue
    steps:
      - skill: westworld-feed
      - skill: westworld-act
        consume: [westworld-feed]
